name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MIN_VERSION_CODE: 1
  APK_NAME: serumah-app.apk

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Android NDK + licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006"

      - name: Create mobile .env
        working-directory: apps/mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_UPDATE_MANIFEST_URL=https://github.com/spacelix/serumah_mono/releases/latest/download/version.json" >> .env

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Setup release keystore
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > serumah-upload.jks
          cat > key.properties <<EOF
          storeFile=serumah-upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        working-directory: apps/mobile
        run: |
          mkdir -p ../../release
          cp android/app/build/outputs/apk/release/app-release.apk ../../release/${{ env.APK_NAME }}
          VERSION_NAME=$(node -e "console.log(require('./app.json').expo.version)")
          VERSION_CODE=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          NOTES=$(git log -1 --pretty=%s | tr -d '"')
          cat > ../../release/version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "minVersionCode": ${{ env.MIN_VERSION_CODE }},
            "apkUrl": "https://github.com/spacelix/serumah_mono/releases/latest/download/${{ env.APK_NAME }}",
            "notes": "$NOTES"
          }
          EOF
          cat ../../release/version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/serumah-app.apk
            release/version.json
          generate_release_notes: true
